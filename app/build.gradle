
plugins {
    id 'com.android.application'
}
android {
    namespace 'net.slapilot.private'
    compileSdk 34
    defaultConfig {
        applicationId "net.slapilot.private"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "4.0"
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
