name: JK Model Y Pilot Android APK
on:
  push:
    branches: [jk-modely-pilot-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack JK Model Y Pilot
        run: |
          mkdir -p jkproject
          base64 --decode jk-modely-pilot-source.tar.xz.b64 | tar -xJ -C jkproject
          test -f jkproject/app/src/main/java/com/jk/modelypilot/MainActivity.java
      - name: Compile APK
        working-directory: jkproject
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JK-ModelY-Pilot-APK
          path: jkproject/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
